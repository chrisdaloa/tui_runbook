name: Auto Release

# Triggered when pyproject.toml is pushed to main.
# Reads the version field, skips if that tag already exists,
# otherwise runs tests → builds wheel + binaries → creates GitHub Release.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  # ------------------------------------------------------------------
  # Read version and decide whether a release is needed
  # ------------------------------------------------------------------
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to inspect existing tags

      - name: Read version from pyproject.toml
        id: read
        run: |
          VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: check
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG is new — release will be created."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Tests
  # ------------------------------------------------------------------
  test:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q

  # ------------------------------------------------------------------
  # Python wheel + sdist
  # ------------------------------------------------------------------
  build-wheel:
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  # ------------------------------------------------------------------
  # Standalone binaries (Linux, macOS arm64/x86_64, Windows)
  # ------------------------------------------------------------------
  build-binary:
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: runbook-linux-x86_64
          - os: macos-latest
            asset: runbook-macos-arm64
          - os: macos-13
            asset: runbook-macos-x86_64
          - os: windows-latest
            asset: runbook-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and PyInstaller
        run: pip install -e "." pyinstaller
      - name: Build binary
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --name runbook \
            --collect-all textual \
            --collect-all rich \
            runbook/__main__.py
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv dist/runbook dist/${{ matrix.asset }}
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/runbook.exe "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.asset }}

  # ------------------------------------------------------------------
  # Create GitHub Release with all assets
  # ------------------------------------------------------------------
  release:
    needs: [check-version, build-wheel, build-binary]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/wheel/*.whl
            artifacts/wheel/*.tar.gz
            artifacts/binary-ubuntu-latest/runbook-linux-x86_64
            artifacts/binary-macos-latest/runbook-macos-arm64
            artifacts/binary-macos-13/runbook-macos-x86_64
            artifacts/binary-windows-latest/runbook-windows-x86_64.exe
