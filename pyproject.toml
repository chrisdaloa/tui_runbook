[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runbook"
version = "0.1.1"
description = "Interactive CLI runbook executor"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60.0",
    "mistune>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
runbook = "runbook.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
